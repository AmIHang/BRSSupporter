[package]
name = "brssupporter"
version = "0.1.0"
description = "BSM-Tickets für Supporter tracken und analysieren."
edition = "2021"
publish = false

[lib]
name = "brssupporter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
